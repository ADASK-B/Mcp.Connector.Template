{{- if .Values.route.enabled }}
{{- if not .Values.route.hostname }}
{{- fail "route.hostname is required when route.enabled=true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mcp-connector.fullname" . }}
  labels:
    {{- include "mcp-connector.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.parentRef.name }}
      namespace: {{ .Values.route.parentRef.namespace }}
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "mcp-connector.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
