---
name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build-and-test:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version-file: .python-version

      - name: Validate the closed release source boundary
        run: |
          python scripts/validate_repo.py
          python scripts/release_pipeline_test.py

      - name: Project the exact release toolchain
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("release/release-input.json"))["version"])')"
          python scripts/github_release_env.py --tag "v$VERSION" \
            --output "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309  # v5.1.0
        with:
          dotnet-version: ${{ steps.release.outputs.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
        with:
          version: ${{ steps.release.outputs.HELM_VERSION }}

      - name: Install Foundation-pinned CUE
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 "$CUE_SOURCE" -o "$RUNNER_TEMP/cue.tar.gz"
          echo "$CUE_SHA256  $RUNNER_TEMP/cue.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cue.tar.gz" -C "$RUNNER_TEMP" cue
          chmod 0755 "$RUNNER_TEMP/cue"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate immutable Application and chart contracts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: //p' charts/mcp-connector/Chart.yaml)"
          test "$(sed -n 's/^appVersion: "\(.*\)"/\1/p' charts/mcp-connector/Chart.yaml)" = "$VERSION"
          test "$(python3 -c 'import json; print(json.load(open("release/release-input.json"))["version"])')" = "$VERSION"
          CONTRACTS="$RUNNER_TEMP/foundation-contracts"
          RELEASE_OUTPUT="$RUNNER_TEMP/application-release"
          python scripts/fetch_foundation_contracts.py --output "$CONTRACTS"
          python scripts/render_release.py \
            --image-digest "sha256:$(printf 'a%.0s' {1..64})" \
            --chart-digest "sha256:$(printf 'b%.0s' {1..64})" \
            --output "$RELEASE_OUTPUT" \
            --binding-output "$RUNNER_TEMP/application-package-binding.json"
          cue vet -c "$CONTRACTS/application-contract.schema.cue" \
            "$RELEASE_OUTPUT/application-contract.yaml" -d '#ApplicationContract'
          cue vet -c "$CONTRACTS/application-contract.schema.cue" \
            "$CONTRACTS/application-delivery-package.schema.cue" \
            "$RUNNER_TEMP/application-package-binding.json" \
            -d '#ApplicationZarfPackage'
          helm lint charts/mcp-connector \
            --values release/trivy-chart-values.yaml
          helm template platform-test-app charts/mcp-connector \
            --values release/trivy-chart-values.yaml \
            >/dev/null
          bash scripts/validate-configuration-contract.sh

      - name: Generate coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:./TestResults/**/coverage.cobertura.xml \
            -targetdir:./TestResults/CoverageReport \
            -reporttypes:MarkdownSummaryGithub
          cat ./TestResults/CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
