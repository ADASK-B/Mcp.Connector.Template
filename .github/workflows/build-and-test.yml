---
name: Build and Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309  # v5.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
        with:
          version: v4.1.3

      - name: Validate immutable App chart contract
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: //p' charts/mcp-connector/Chart.yaml)"
          test "$(sed -n 's/^appVersion: "\(.*\)"/\1/p' charts/mcp-connector/Chart.yaml)" = "$VERSION"
          test "$(python3 -c 'import json; print(json.load(open("release/release-input.json"))["version"])')" = "$VERSION"
          helm lint charts/mcp-connector \
            --set image.repository=registry.invalid/reference/mcp-connector \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm template mcp-reference charts/mcp-connector \
            --set image.repository=registry.invalid/reference/mcp-connector \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            >/dev/null
          release_workflow=.github/workflows/release.yml
          grep -Fq 'flavor: latest=false' "$release_workflow"
          grep -Fq 'limit-severities-for-sarif: true' "$release_workflow"
          if grep -Eq '^[[:space:]]+push:[[:space:]]+true$' "$release_workflow"; then
            echo 'Release workflow must scan before publishing.' >&2
            exit 1
          fi
          scan_line="$(grep -nF -- '- name: Scan immutable image' "$release_workflow" | cut -d: -f1)"
          publish_line="$(grep -nF -- '- name: Publish scanned immutable image' "$release_workflow" | cut -d: -f1)"
          sign_line="$(grep -nF -- '- name: Sign and attest published image' "$release_workflow" | cut -d: -f1)"
          chart_line="$(grep -nF -- '- name: Publish immutable Helm chart' "$release_workflow" | cut -d: -f1)"
          test "$scan_line" -lt "$publish_line"
          test "$publish_line" -lt "$sign_line"
          test "$sign_line" -lt "$chart_line"

      - name: Generate coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:./TestResults/**/coverage.cobertura.xml \
            -targetdir:./TestResults/CoverageReport \
            -reporttypes:MarkdownSummaryGithub
          cat ./TestResults/CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
